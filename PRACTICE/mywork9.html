<!DOCTYPE html>
<html>
  <head>
    <title>overlay</title>

    <style>
      .sidebar{
        position: fixed;
        right: 0px;
        top: 0px;
        bottom: 0px;
        background-color: aqua;
      }

      .overlay{
        position: fixed;
        top: 0px;
        bottom: 0px;
        left: 0px;
        right: 0px;
        bottom: 0px;
        background-color: rgba(0,0,0,0.2);
        padding-left: 250px;
        padding-top: 200px;
      }

      .info{
        border: none;
        border-radius: 8px;
        margin-right: 50px;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        background-color: white;
        line-height: 25px;
        font-family: Arial, Helvetica, sans-serif;
      }

      .title{
        font-weight: 600;
        font-size: 25px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body style="height:1000px;">
    <div>yooo!!!</div>
    <div class="sidebar">
      right sidebar
    </div>

    <div class="overlay">
      <div class="info">
        <div class="title">Modal Titlt</div>
        <div>This is a modal</div>
        <button>close</button>
      </div>
    </div>
  </body>
</html>
