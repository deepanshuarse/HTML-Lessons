<!DOCTYPE html>
<html>
  <head>
    <title>Uber deno</title>
    <style>
      .text{
        font-size: 40px;
        font-family: arial;
        font-weight:bold;
      }
      .input{
        background-color:rgb(220, 220, 220);
        padding-left: 10px;
        padding-right: 50px;
        padding-top: 15px;
        padding-bottom: 15px;
        display:block;
        margin-bottom: 10px;
        border: none;
      }
      .one{
        padding-left: 50px;
        padding-right: 50px;
        padding-top: 15px;
        padding-bottom: 15px;
        background-color: black;
        color : white;
        margin-right: 12px;
        margin-top: 40px;
      }
      .two{
        padding-left: 50px;
        padding-right: 50px;
        padding-top: 15px;
        padding-bottom: 15px;
        background-color : rgb(220, 220, 220);
        color : rgb(0, 0, 0);
        border: none;
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <p class="text">
      Request a ride now
    </p>
    <input class="input" type="text" placeholder="Enter pickup location" style="width:500px;">
    <input class="input" type="text" placeholder="Enter destination" style="width:500px;">
    <button class="one">
      Request now
    </button>
    <button class="two">
      Schedule for later
    </button>
  </body>
</html>
