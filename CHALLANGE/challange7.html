<!DOCTYPE html>
<html>
  <head>
    <title>Twitter</title>

    <style>
      .base{
        width: 400px;
        display: flex;
        box-shadow: 3px 3px 10px rgba(0,0,0,0.25);
        border-radius: 8px;
      }

      .profile-picture{
        width: 40px;
        margin-top: 6px;
        margin-left: 6px;
        margin-right: 10px;
      }

      .picture{
        width: 40px;
        border-radius: 50%;
      }

      .title{
        display: flex;
        font-family: Arial, Helvetica, sans-serif;
        margin-top: 6px;
      }

      .name{
        font-size: 15px;
        font-weight: 600;
        margin-right: 7px;
      }

      .username{
        font-size: 15px;
        color: rgb(66, 66, 66);
        margin-bottom: 4px;
      }

      .text{
        font-size: 15px;
        font-family: Arial, Helvetica, sans-serif;
        margin-bottom: 15px;
      }

      .file{
        display: flex;
        margin-bottom: 10px;
      }

      .blank{
        background-color: rgb(160, 159, 159);
        width: 70px;
        border-radius: 18px 0 0 18px;
      }

      .youtube-info{
        padding-left: 8px;
        padding-right: 12px;
        padding-top: 8px;
        padding-bottom: 8px;
        border-radius: 0 18px 18px 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        border-style: solid;
        border-width: 0.7px;
        border-color: rgb(160, 159, 159);
      }

      .youtube-link{
        margin-bottom: 6px;
        color: rgb(66, 66, 66);
      }
    </style>
  </head>
  <body>
    <div class="base">
      <div class="profile-picture">
        <img class="picture" src="/other-picture/two.jpg">
      </div>
      <div>
        <div class="title">
          <div class="name">Deepanshu.dev</div>
          <div class="username">@Deepanshudev</div>
        </div>
        <div class="text">What is backend web development? A complete overview. new video is up</div>
        <div class="file">
          <div class="blank">
          </div>
          <div class="youtube-info">
            <div class="youtube-link">youtube.com</div>
            <div>Backend web development - a</div>
            <div>complete overview (2021)</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
