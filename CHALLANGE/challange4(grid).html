<!doctype html>
<html>
  <head>
    <title>follow</title>

    <style>
      p {
        margin-top: 0px;
        margin-bottom: 0px;
        font-family: arial;
      }
      .preview {
        width: 200px;
        background-color: rgb(250, 229, 229);
        margin-right: 16px;
        margin-bottom: 12px;
        box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.3);
      }

      .grid{
        display: grid;
        grid-template-columns: 200px 200px 200px;
        column-gap: 20px;
      }

      .mutual,
      .info {
        margin-top: 5px;
      }
      .profile {
        width: 200px;
      }

      .mutual {
        width: 40px;
        margin-left: 7px;
        border-radius: 50%;
      }

      .user-name {
        margin-left: 11px;
        font-weight: 900;
        font-size: 18px;
      }

      .info {
        color: rgb(93, 92, 92);
      }

      .add {
        background-color: rgb(0, 128, 255);
        padding-left: 10px;
        padding-right: 10px;
        padding-bottom: 6px;
        padding-top: 6px;
        border: none;
        border-radius: 6px;
        margin-left: 12px;
        margin-top: 10px;
        margin-bottom: 10px;
        font-weight: bolder;
        color: white;
        transition: 0.15s;
      }

      .add:active {
        opacity: 0.6;
      }

      .info-gird{
        display: grid;
        grid-template-columns: 50px 1fr;
        align-items: center;
        column-gap: 7px;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="preview">
        <div class="profile-row">
          <img class="profile" src="/thumbnails/one.jpg" />
        </div>
        <div>
          <p class="user-name">Olive</p>
        </div>
        <div class="info-gird">
          <div>
            <img class="mutual" src="/thumbnails/mutual.jpg" />
          </div>
          <div>
            <p class="info">2 mutual friends</p>
          </div>
        </div>
        <button class="add">Add Friends</button>
      </div>

      <div class="grid">
      <div class="preview">
        <div class="profile-row">
          <img class="profile" src="/thumbnails/two.jpg" />
        </div>
        <div>
          <p class="user-name">Alex</p>
        </div>
        <div class="info-gird">
          <div>
            <img class="mutual" src="/thumbnails/mutual.jpg" />
          </div>
          <div>
            <p class="info">12 mutual friends</p>
          </div>
        </div>
        <button class="add">Add Friends</button>
      </div>

      <div class="grid">
      <div class="preview">
        <div class="profile-row">
          <img class="profile" src="/thumbnails/three.jpg" />
        </div>
        <div>
          <p class="user-name">Lisa</p>
        </div>
        <div class="info-gird">
          <div>
            <img class="mutual" src="/thumbnails/mutual.jpg" />
          </div>
          <div>
            <p class="info">32 mutual friends</p>
          </div>
        </div>
        <button class="add">Add Friends</button>
      </div>
  </body>
</html>
