<!DOCTYPE html>
<html>
  <head> 
    <style>
      .background {
        margin: 0;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
        opacity: 0.8;
      }
      .card {
        margin-left: 350px;
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
        padding-top: 12px;
        padding-bottom: 12px;
        padding-left: 12px;
        padding-right: 12px;
        width: 550px;
        border-radius: 6px;
        background-color: rgb(255, 209, 154);
      }
      .profile{
        width: 100px;
        border-radius: 50%;
        object-fit: cover;
        vertical-align: middle;
        margin-right: 12px;
      }
      .text-box{
        font-size: 21px;
        border: none;
        vertical-align: middle;
        width: 320px;
        background-color: rgb(255, 209, 154);
      }
      .tweet{
        padding-left: 23px;
        padding-right: 23px;
        padding-top: 12px;
        padding-bottom: 12px;
        border-radius: 21px;
        border: none;
        color: white;
        background-color: rgb(29, 131, 255);
        font-size: large;
        font-weight: bold;
        transition: opacity 0.15s;
      }
      .tweet:active{
        opacity: 0.8;
      }

      .follow{
        width: 130px;
        padding-left: 3px;
        padding-right: 3px;
        padding-bottom: 13px;
        padding-top: 10px;
        background-color: rgb(8, 5, 3);
        border-radius: 12px;
        display: inline-block;
        margin-left: 21px;
        margin-top: 51px;
        
        
      }
      .first{
        width: 120px;
        margin-bottom: 0px;
        border-radius: 13px;
        margin-left: 5px;
      }
      .mutual{
        font-size: 13px;
        margin-top: 0px;
        font-family: arial;
        color: rgb(255, 255, 255);
        margin-left: 9px;
      }
      .names{
        font-size: 14px;
        margin-bottom: 0px;
        font-family: arial;
        color: white;
        margin-left: 9px;
      }
      .add{
        background-color: rgb(12, 133, 254);
        color: white;
        border-radius: 18px;
        border: none;
        padding-left: 11px;
        padding-right: 11px;
        padding-bottom: 8px;
        padding-top: 8px;
        font-weight: bold;
        margin-left: 15px;
        transition: opacity 0.15s;
      }

      .add:active{
        opacity: 0.6;
      }
      .user{
        display: inline-block;
        margin-left: 310px;
      }

    </style>
  </head>
  <body>
    <img src="thumbnails/background-1.jpg" class="background">
    <div class="card">
      <img src="thumbnails/one.jpg" class="profile">
      <input type="text" class="text-box" placeholder="What's happening?">
      <button class="tweet">
        Tweet
      </button>
    </div>
    <div class="user">
      <div class="follow">
        <img src="thumbnails/one.jpg" class="first">
        <p class="names">
          Deepanshu
        </p>
        <p class="mutual">
          12 mutual friends
        </p>
        <button class="add">
          Add Friends
        </button>
      </div>
      <div class="follow">
        <img src="thumbnails/two.jpg" class="first">
        <p class="names">
          Sejal
        </p>
        <p class="mutual">
          32 mutual friends
        </p>
        <button class="add">
          Add Friends
        </button>
      </div>
      <div class="follow">
        <img src="thumbnails/three.jpg" class="first">
        <p class="names">
          Anshu
        </p>
        <p class="mutual">
          3 mutual friends
        </p>
        <button class="add">
          Add Friends
        </button>
      </div>
      <div class="follow">
        <img src="thumbnails/four.jpg" class="first">
        <p class="names">
          SON
        </p>
        <p class="mutual">
          99 mutual friends
        </p>
        <button class="add">
          Add Friends
        </button>
      </div>
    </div>
  </body>
</html>
