<!doctype html>
<html>
  <head>
    <title>design copy</title>

    <style>
      .card {
        background-color: rgb(252, 252, 252);
        width: 300px;
        border-radius: 12px;
        box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.2);
      }

      .info {
        margin: 0;
        padding-left: 20px;
        padding-right: 15px;
        padding-top: 15px;
        padding-bottom: 20px;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        font-family: Arial, Helvetica, sans-serif;
      }

      .button {
        background-color: rgb(56, 118, 254);
        padding-left: 12px;
        padding-right: 12px;
        padding-top: 5px;
        padding-bottom: 5px;
        border: none;
        border-radius: 12px;
        color: white;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="info">
        <div>Home</div>
        <div>
          <button class="button">14</button>
        </div>
      </div>

      <div>
        <div class="info">
          <div>Notifications</div>
          <div>
            <button class="button">3</button>
          </div>
        </div>
      </div>

      <div>
        <div class="info">
          <div>Messages</div>
          <div>
            <button class="button">5</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
